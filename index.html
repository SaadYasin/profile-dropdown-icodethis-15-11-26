<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwindcss CDN -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
     <!-- Font awesome CDN -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
     
      <style type="text/tailwindcss">
      @theme {
        --color-bgBody: #2c2446;
        --color-bgMain: #3e3c46;
        --color-bgCard: #393741;
        --color-bgCard2: #42414a;
        --color-bgBtn: #f49b74;
        --color-bgBtnHover: #d4602d;
        --color-bgTag1: #75ccb8;
        --color-bgTag1Hover: #5da89c;
        --color-bgTag2: #759dcd;
        --color-bgTag2Hover: #5a81b3;
        --color-bgTag3: #be77cd;
        --color-bgTag3Hover: #a45db3;
      }
    </style>

    <title>Profile Dropdown | iCode This 15-11-2026</title>
</head>
<body class="bg-[var(--color-bgMain)] lg:bg-[var(--color-bgBody)] w-full h-[100dvh]">
    <!-- Container -->
     <main class="flex justify-center items-center w-[65%] h-[100%] bg-[var(--color-bgMain)] mx-auto">
        <!-- Card -->
         <section class="w-90 lg:w-108 h-145 bg-[var(--color-bgCard)] rounded-md shadow-xl/20 shadow-gray-700">
           <div class="flex justify-end items-center gap-7 pt-16 pr-5 lg:pr-16 mb-3">
            <i class="fa-regular fa-bell text-xl text-white/50 cursor-pointer"></i>
            <img src="https://github.com/SaadYasin/web-images/blob/main/avatar02.jpg?raw=true" alt="" class="w-10 h-10 rounded-full cursor-pointer" id="profile">
           </div> 

           <!-- Inner card -->
            <div class="flex flex-col w-78 h-101 bg-[var(--color-bgCard2)] rounded-md shadow-xl/10 mx-auto">
                <!-- Header -->
                 <div class="flex justify-start items-center mt-4 mb-5">
                    <img src="https://github.com/SaadYasin/web-images/blob/main/avatar02.jpg?raw=true" alt="" class="w-17 h-17 rounded-full shadow-xl/40 ml-5 mt-5">

                    <!-- Text block -->
                     <div class="flex flex-col justify-center items-start">
                        <h1 class="text-white text-[.85rem] font-semibold ml-5 ">Lisa Portman</h1>
                        <p class="text-white/50 text-sm ml-5 mb-2">lisa67@domain.com</p>
                        <button class="text-[.75rem] text-white w-30 bg-[var(--color-bgBtn)] rounded ml-5 py-1 hover:bg-[var(--color-bgBtnHover)] cursor-pointer">Account settings</button>
                     </div>

                     <!-- Divider -->
                      
                 </div>
                 <div class="w-70 h-[1.5px] bg-black/10 mx-auto"></div>

                 <!-- Accounts list -->
                  <div class="flex flex-col justify-start items-left ml-5 mt-5 mb-5">
                    <!-- Tags items -->
                     <!-- Tag 1 -->
                    <div class="flex items-center mb-4">
                      <div class="bg-[var(--color-bgTag1)] text-white text-md font-bold w-11 h-11 rounded-full flex items-center justify-center hover:bg-[var(--color-bgTag1Hover)] cursor-pointer">SS</div>
                      <div class="flex flex-col justify-left items-start ml-3">
                        <p class="text-white text-[.85rem] font-semibold">Lisa Portman</p>
                        <p class="text-white text-[.75rem] font-medium">support@domain.com</p>
                      </div>
                    </div>

                    <!-- Tag 2 -->
                    <div class="flex items-center mb-4">
                      <div class="bg-[var(--color-bgTag2)] text-white text-md font-bold w-11 h-11 rounded-full flex items-center justify-center hover:bg-[var(--color-bgTag2Hover)] cursor-pointer">SS</div>
                      <div class="flex flex-col justify-left items-start ml-3">
                        <p class="text-white text-[.85rem] font-semibold">Lisa Portman</p>
                        <p class="text-white text-[.75rem] font-medium">accounting@domain.com</p>
                      </div>
                    </div>

                    <!-- Tag 3 -->
                    <div class="flex items-center mb-4">
                      <div class="bg-[var(--color-bgTag3)] text-white text-md font-bold w-11 h-11 rounded-full flex items-center justify-center hover:bg-[var(--color-bgTag3Hover)] cursor-pointer">SS</div>
                      <div class="flex flex-col justify-left items-start ml-3">
                        <p class="text-white text-[.85rem] font-semibold">Lisa Portman</p>
                        <p class="text-white text-[.75rem] font-medium">hello@domain.com</p>
                      </div>
                    </div>
                  </div>

                  <!-- Card bottom -->
                   <div class="flex justify-between items-center px-5">
                      <button type="button" aria-label="Add account" id="plus_btn" class="relative flex justify-center items-center w-11 h-11 bg-transparent border-1 border-black/30 border-dashed rounded-full hover:bg-[var(--color-bgCard)] cursor-pointer">
                        <i class="fa-solid fa-plus text-xl text-white"></i>
                      </button>
                      <button class="text-[.75rem] text-white w-30 bg-transparent border-1 border-black/30 ml-5 py-1 hover:bg-[var(--color-bgCard)] cursor-pointer">Sign out</button>
                   </div>
            </div>
         </section>
     </main>
    <script src="script.js"></script>
</body>
</html>
